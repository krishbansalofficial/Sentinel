name: Release

# Phase 6 of HANDOFF.md: `pipx install sentinel-runtime`. A version tag (v0.1.0) builds the
# sdist and wheel, checks them, smoke-tests a clean install, and publishes to PyPI with
# trusted publishing (OIDC): no API token is stored anywhere. One-time setup on pypi.org:
# add a pending trusted publisher for project "sentinel-runtime", owner
# "krishbansalofficial", repository "Sentinel", workflow "release.yml", environment "pypi".
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: The tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Build and check the distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Smoke-test a clean install of the wheel
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/smoke/bin/sentinel" --version
          "$RUNNER_TEMP/smoke/bin/sentinel" eval run --suite evals/tasks --agent mock --task op-add \
            --k 1 --mock-skill 1 --allow-unconfined-hidden-tests --out "$RUNNER_TEMP/smoke.json"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/sentinel-runtime/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
