name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned project and test dependencies
        run: python -m pip install -e ".[test,tui,keyring]"
      - name: Run default test suite
        run: python -m pytest -q

  # Phase 0 of HANDOFF.md: the backend boots and the suite runs off Windows. Windows-only
  # tests (AppContainers, Job Objects, CNG, Credential Manager) skip with a reason.
  pytest-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned project and test dependencies
        run: python -m pip install -e ".[test,tui,keyring]"
      - name: Collection has no errors
        run: python -m pytest --collect-only -q
      - name: Run default test suite
        run: python -m pytest -q -rs
