name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned project and test dependencies
        run: python -m pip install -e ".[test,tui,keyring]"
      - name: Run default test suite
        run: python -m pytest -q

  # Phase 0 of HANDOFF.md: the backend boots and the suite runs off Windows. Windows-only
  # tests (AppContainers, Job Objects, CNG, Credential Manager) skip with a reason.
  pytest-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned project and test dependencies
        run: python -m pip install -e ".[test,tui,keyring]"
      - name: Collection has no errors
        run: python -m pytest --collect-only -q
      - name: Run default test suite
        run: python -m pytest -q -rs

  # Phase 1 of HANDOFF.md: the verified Linux sandbox against a real kernel with cgroup v2
  # controllers (fork bomb, freeze, kill). The tests fail rather than skip if the
  # environment below is not set up (SENTINEL_REQUIRE_LINUX_SANDBOX=1).
  linux-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install bubblewrap and the pinned project
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          python -m pip install -e ".[test,tui,keyring]"
      - name: Sandbox tests in a delegated cgroup v2 subtree
        env:
          SENTINEL_REQUIRE_LINUX_SANDBOX: '1'
        run: |
          set -eu
          D=/sys/fs/cgroup/sentinel-ci
          sudo mkdir -p "$D/shell"
          echo "+pids +memory +cpu" | sudo tee /sys/fs/cgroup/cgroup.subtree_control
          sudo chown -R "$(id -u):$(id -g)" "$D"
          # This shell (and so pytest) lives in a leaf of the delegated subtree, so the
          # sandbox may move processes between its run cgroups and the leaf.
          echo $$ | sudo tee "$D/shell/cgroup.procs"
          export SENTINEL_TEST_CGROUP_PARENT="$D"
          python -m pytest -q -rs backend/tests/execution/linux backend/tests/execution/test_seccomp.py backend/tests/execution/test_cgroups.py
