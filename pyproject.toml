[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "change-assurance"
version = "0.1.0"
description = "Local-first Change Assurance Runtime"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "uvicorn[standard]==0.53.0",
  "typer==0.27.2",
  "rich==14.3.4",
  "cryptography==47.0.0",
  # macOS keeps provider credentials in the Keychain through keyring (the default store there).
  "keyring==25.7.0; sys_platform == 'darwin'",
]

[project.scripts]
sentinel = "backend.app.cli.main:main"

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "pytest-cov==7.1.0",
]
# SDK/exporter are opt-in: export connected runtime traces to an OTLP collector.
telemetry = [
  "opentelemetry-sdk==1.38.0",
  "opentelemetry-exporter-otlp-proto-http==1.38.0",
]
tui = [
  "textual==0.89.1",
]
# Opt-in on Linux: SENTINEL_CREDENTIAL_STORE=keyring uses the Secret Service instead of
# the weaker owner-only file store.
keyring = [
  "keyring==25.7.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["backend/tests"]
