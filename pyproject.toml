[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-runtime"
version = "0.1.0"
description = "A change assurance runtime for AI coding agents: verified boundaries, signed evidence, and an agent regression lab"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Krish Bansal" }]
requires-python = ">=3.12"
keywords = ["ai-agents", "sandbox", "evals", "supply-chain", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "uvicorn[standard]==0.53.0",
  "typer==0.27.2",
  "rich==14.3.4",
  "cryptography==50.0.2",
  # Confined Python verification must work in the self-contained desktop bundle.
  "pytest==9.0.3",
  "coverage==7.16.2",
  # macOS keeps provider credentials in the Keychain through keyring (the default store there).
  "keyring==25.7.0; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/krishbansalofficial/Sentinel"
Issues = "https://github.com/krishbansalofficial/Sentinel/issues"

[project.scripts]
sentinel = "backend.app.cli.main:main"

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
]
# SDK/exporter are opt-in: export connected runtime traces to an OTLP collector.
telemetry = [
  "opentelemetry-sdk==1.38.0",
  "opentelemetry-exporter-otlp-proto-http==1.38.0",
]
tui = [
  "textual==0.89.1",
]
# Opt-in on Linux: SENTINEL_CREDENTIAL_STORE=keyring uses the Secret Service instead of
# the weaker owner-only file store.
keyring = [
  "keyring==25.7.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]
# The test suite stays in the source tree; the published wheel carries only the runtime.
exclude = ["backend.tests*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["backend/tests"]
